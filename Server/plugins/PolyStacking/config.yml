# PolyStacking Configuration
# ------------------------------------------------------------
# All colors support hex codes using &#RRGGBB format
# Example: &#55ff55 for light green

# ------------------------------------------------------------
# General Stacking Messages
# ------------------------------------------------------------
messages:
  prefix: "&a&lPolyStacking&r "
  reloaded: "&fPlugin has been reloaded! &7&o(%time%ms)"
  no-permission: "&cYou don't have permission to do this!"
  help-header: "&a&lPolyStacking Commands"
  help-format: "&e%syntax% &f- %description%"
  help-footer: "&a&lPolyStacking Commands"

# ------------------------------------------------------------
# Performance Settings
# ------------------------------------------------------------
performance:
  # How often (in ticks) to scan for items on the ground.
  # 20 ticks = 1 second.
  item-task-interval: 40
  
  # How often (in ticks) to scan for mobs to stack.
  # 100 ticks = 5 seconds.
  mob-task-interval: 200
  
  # The radius around an entity to search for neighbors.
  # Larger radius = more CPU usage.
  item-stack-radius: 3.0
  mob-stack-radius: 4.0

# ------------------------------------------------------------
# Stacking Limits & Behavior
# ------------------------------------------------------------
stacking:
  # Maximum amount of items allowed in a single stack.
  max-item-stack: 2000
  
  # Maximum amount of mobs allowed in a single stack.
  max-mob-stack: 150
  
  # Cooldown (in seconds) after a mob is split (breeding, shearing, etc.) 
  # before it can stack again.
  mob-stack-cooldown: 10

  # List of mob types that are allowed to stack.
  # Use EntityType names (e.g., COW, PIG, SHEEP, ZOMBIE).
  mob-whitelist:
    - COW
    - PIG
    - CHICKEN
    - SHEEP

  # If true, only vanilla mobs will be stacked. 
  # Mobs from other plugins (MythicMobs, etc.) will be ignored.
  only-vanilla-mobs: true

# ------------------------------------------------------------
# Visual Settings & Display Formats
# ------------------------------------------------------------
visuals:
  # Set the item to glow when it has enchants.
  item-enchants-glowing: false
  
  # Set the item to show display name even if it's only 1 item.
  item-show-single-name: false

  # Display format for item stacks
  # %quantity%: The number of items
  # %name%: The name of the item
  # %colorful_quantity%: Pre-calculated gradient color for the amount
  item-display-format: "&e&l▶ %colorful_quantity% &7%name%"
  
  # Set the mob to show display name even if it's only 1 mob.
  mob-show-single-name: false

  # Enable the pickup animation when picking up stacked items.
  pickup-animation: false

  # Display format for mob stacks
  mob-display-format: "%colorful_quantity% &7%name%"
